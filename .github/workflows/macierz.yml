name: Buduj i poprawiaj macierz kodów dla Excela

on:
  push:
    branches: [main]
    paths:
      - dm_pairs_cache.json.gz
      - geocoding_cache.csv
      - scripts/build_macierz.py
      - ref/geonames_PL.txt
      - geo_resolver.py
      - ref/adresy_erp.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macierz
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Popraw geokody i zbuduj macierz
        run: python scripts/build_macierz.py
      - name: Zapisz w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add mapa_adresow.csv macierz_kody.csv kody_wspolrzedne.csv jakosc_geokodow.csv pareto_bledow.csv ref/osrm_cache.json
          if git diff --cached --quiet; then
            echo "Bez zmian"
          else
            git commit -m "Auto: macierz kodów i korekta geokodów"
            git pull --rebase origin main
            git push
          fi
